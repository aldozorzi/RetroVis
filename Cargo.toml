[package]
name = "retro-vis"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["tokio", "http1", "json", "query"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8"
dashmap = "6.1.0"
# reqwest = { version = "0.13.3", default-features = false, features = ["rustls"] }
hyper          = { version = "1", features = ["http1"] }
hyper-util     = { version = "0.1", features = ["client", "client-legacy", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["rustls-native-certs", "http1", "ring"] }
http-body-util = "0.1"
dotenvy = "0.15.7"
async-trait = "0.1.89"
indoc = "2.0.7"
thiserror = "2"
memmap2 = "0.9.10"

[profile.release]
lto = true
codegen-units = 1
panic = 'abort'


