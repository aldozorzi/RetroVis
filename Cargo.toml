[package]
name = "retro-vis"
version = "0.1.0"
edition = "2024"

[build-dependencies]
embed-resource = "3"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["tokio", "http1", "json", "query"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
serde = { version = "1.0", features = ["derive","rc"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8"
dashmap = "6.1.0"
memmap2 = "0.9.10"



